<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Колесо Фортуны</title>
  <style>
    :root{--bg1:#2c3e50;--bg2:#223043;--btn:#4c86ff;--btnText:#fff}
    *{box-sizing:border-box;margin:0;padding:0}
    html{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      height:100vh;
      background:radial-gradient(1000px 600px at 50% 0%,#34495e 0%,var(--bg1) 50%,var(--bg2) 100%);
      background-color:var(--bg1);
    }
    body{
      margin:0;
      padding:0;
      color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial;
      width:100%;
      height:100%;
      height:100vh;
      min-height:100vh;
      background:radial-gradient(1000px 600px at 50% 0%,#34495e 0%,var(--bg1) 50%,var(--bg2) 100%);
      background-color:var(--bg1);
    }
    .container{
      text-align:center;
      padding:20px 16px;
      width:100%;
      height:100%;
      height:100vh;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
    }
    h1{margin:0 0 18px;font-weight:800;letter-spacing:.2px}

    .wheel-wrap{position:relative;margin:0 auto;flex-shrink:0}
    canvas{display:block;margin:0 auto;background:transparent}

    /* единственная стрелка */
    #pointer{
      position:absolute;top:50%;right:-6px;transform:translateY(-50%);
      width:0;height:0;border-top:12px solid transparent;border-bottom:12px solid transparent;
      border-right:26px solid #ff3b30;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));
    }

    #spin-btn{
      margin-top:22px;padding:14px 28px;font-size:16px;font-weight:700;cursor:pointer;
      border:none;border-radius:12px;background:var(--btn);color:var(--btnText);
      box-shadow:0 10px 24px rgba(76,134,255,.35),inset 0 0 0 1px rgba(255,255,255,.12);
      transition:transform .08s ease,filter .2s ease
    }
    #spin-btn:hover{filter:brightness(1.06)}
    #spin-btn:active{transform:translateY(1px)}
    #spin-btn:disabled{background:#8a8a8a;cursor:not-allowed;box-shadow:none}
    .hint{opacity:.85;font-size:13px;margin:10px 0 0}

    /* модалка результата */
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);
      display:flex;align-items:center;justify-content:center;padding:16px}
    .hidden{display:none}
    .modal-card{width:min(520px,92vw);background:#1e2736;border-radius:16px;padding:22px 20px;
      box-shadow:0 12px 30px rgba(0,0,0,.45);text-align:left}
    .modal-title{font-size:18px;font-weight:800;margin:0 0 10px}
    .modal-text{font-size:16px;line-height:1.6;color:#e9eef9;margin:0;white-space:pre-line;letter-spacing:.2px}
    .modal-text b{color:#fff}
    .modal-btn{margin-top:16px;padding:12px 18px;border:none;border-radius:10px;background:#36b37e;
      color:#fff;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(54,179,126,.35)}
    .meme{display:block;width:100%;max-height:360px;object-fit:contain;margin-top:14px;border-radius:10px}


    /* на десктопах — компактный размер, но занимает всю высоту */
    @media (min-width:1024px){
      .container{
        width:100%;
        height:100%;
        height:100vh;
        min-height:100vh;
        max-width:none;
        padding:20px;
      }
      .wheel-wrap{
        width:440px;
        max-width:440px;
      }
      canvas{
        width:440px;
        height:440px;
        max-width:440px;
      }
    }
 .demo-label{font-size:11px;opacity:.65;margin-bottom:15px}.modal{overflow:auto}.modal-card{max-height:90vh;overflow:auto}button:focus-visible{outline:3px solid white;outline-offset:4px}@media(max-height:600px){.container{height:auto;min-height:100vh;padding-block:30px}}


    html,body{height:auto;min-height:100%;background:#110f0f;color:#f0e7d8}
    body{font-family:"Arial Narrow","Roboto Condensed","Segoe UI",Arial,sans-serif;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px),radial-gradient(circle at 72% 42%,#54211d66 0,transparent 39%);background-size:52px 52px,52px 52px,100% 100%}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background:repeating-linear-gradient(117deg,transparent 0 7px,#000 8px 9px)}
    .container{width:min(1480px,100%);height:auto;min-height:100svh;margin:auto;padding:clamp(28px,4.8vw,78px);display:grid;grid-template-columns:minmax(340px,.82fr) minmax(520px,1.18fr);gap:clamp(38px,7vw,118px);align-items:center;text-align:left}
    .roulette-intro{position:relative;padding:24px 0 26px;border-top:1px solid #f0e7d859;border-bottom:1px solid #f0e7d859}
    .roulette-intro:after{content:"";position:absolute;right:-8px;bottom:-8px;width:15px;height:15px;background:#d84a3f;border-radius:50%}
    .roulette-kicker{display:flex;justify-content:space-between;gap:20px;margin-bottom:clamp(46px,7vh,90px);font:700 10px/1.2 "Segoe UI",Arial,sans-serif;letter-spacing:.2em;color:#d9c7a6}
    .roulette-kicker span:last-child{color:#d84a3f}
    h1{margin:0 0 28px;font-size:clamp(58px,6.7vw,104px);line-height:.82;letter-spacing:-.075em;font-weight:800;text-transform:uppercase}
    h1 span,h1 em{display:block}

    .roulette-stage{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0;padding:18px 24px 25px;background:#e8ddca;color:#171312;box-shadow:16px 16px 0 #4f1f1b}
    .roulette-stage:before,.roulette-stage:after{content:"";position:absolute;left:-9px;width:18px;height:18px;border-radius:50%;background:#110f0f}.roulette-stage:before{top:41%}.roulette-stage:after{top:58%}

    .wheel-wrap{position:relative;width:min(100%,570px);max-width:570px;margin:22px auto 0;padding:12px;border:1px solid #17131263;border-radius:50%;background:#181414;box-shadow:none}
    .wheel-wrap:before,.wheel-wrap:after{content:"";position:absolute;inset:4%;border:1px dashed #e8ddca52;border-radius:50%;pointer-events:none}.wheel-wrap:after{inset:-13px;border-color:#17131233}
    canvas,.wheel-wrap canvas{width:100%;height:auto;max-width:none;aspect-ratio:1}
    #pointer{right:1px;border-top-width:15px;border-bottom-width:15px;border-right:31px solid #f0dfb7;filter:drop-shadow(0 2px 0 #171312)}
    .roulette-action{display:grid;grid-template-columns:minmax(220px,1fr) minmax(120px,.6fr);align-items:center;gap:17px;width:100%;margin-top:18px;border-top:1px dashed #17131255;padding-top:18px}
    #spin-btn{width:100%;margin:0;display:flex;align-items:center;justify-content:space-between;padding:17px 19px;border:0;border-radius:0;background:#171312;color:#f0e7d8;box-shadow:none;font:800 14px/1 "Segoe UI",Arial,sans-serif;letter-spacing:.02em;text-transform:uppercase}
    #spin-btn:hover{background:#a53731;filter:none}#spin-btn:active{transform:translateY(1px)}#spin-btn:disabled{background:#a79e90;color:#514a42}
    .hint{margin:0;min-height:0;font:600 11px/1.4 "Segoe UI",Arial,sans-serif;color:#6d6257;text-align:left}button:focus-visible{outline:3px solid #d84a3f;outline-offset:4px}
    .modal{z-index:20;overflow:auto;background:#110f0fe8;backdrop-filter:blur(5px)}
    .modal-card{position:relative;width:min(560px,92vw);max-height:90vh;overflow:auto;padding:22px 28px 29px;border:0;border-radius:0;background:#e8ddca;color:#171312;box-shadow:14px 14px 0 #7e2d27;text-align:left}
    .modal-card:before,.modal-card:after{content:"";position:absolute;top:54px;width:20px;height:20px;border-radius:50%;background:#110f0f}.modal-card:before{left:-10px}.modal-card:after{right:-10px}
    .modal-index{display:flex;justify-content:space-between;padding-bottom:15px;border-bottom:1px dashed #17131266;font:800 9px/1 "Segoe UI",Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#7e2d27}
    .modal-title{margin:28px 0 12px;font:800 clamp(30px,5vw,48px)/.95 "Arial Narrow","Segoe UI",Arial,sans-serif;letter-spacing:-.055em;text-transform:uppercase}
    .modal-text,.modal-text b{color:#4f463e;font:400 16px/1.6 "Segoe UI",Arial,sans-serif}.modal-btn{margin-top:24px;padding:14px 22px;border:0;border-radius:0;background:#171312;color:#f0e7d8;box-shadow:none;font-weight:800;text-transform:uppercase}.meme{border-radius:0}
    @media(max-width:900px){.container{grid-template-columns:1fr;gap:24px;padding:30px 28px 42px}.roulette-intro{padding:14px 0 18px}.roulette-kicker{margin-bottom:26px}h1{font-size:clamp(58px,10vw,82px);margin-bottom:20px}.roulette-facts{display:none}.demo-label{margin-top:15px}.roulette-stage{width:min(620px,100%);margin:auto}.wheel-wrap{width:min(100%,470px)}}
    @media(min-width:501px) and (max-width:900px){.container{padding-top:24px;gap:18px}.roulette-kicker{margin-bottom:18px}h1{font-size:54px}.roulette-description{font-size:14px}.wheel-wrap{width:min(100%,390px);margin-top:14px}.roulette-action{padding-top:14px;margin-top:12px}}
    @media(max-width:500px){body{background-size:36px 36px,36px 36px,100% 100%}.container{padding:18px 14px 28px;gap:16px}.roulette-intro{padding:12px 4px 15px}.roulette-kicker{margin-bottom:21px;font-size:8px}h1{font-size:47px;line-height:.84;margin-bottom:17px}h1 em{margin-top:12px;font-size:.66em}.roulette-description{font-size:13px;line-height:1.48}.demo-label{font-size:8px;margin-top:11px}.roulette-stage{padding:13px 11px 16px;box-shadow:7px 7px 0 #4f1f1b}.stage-meta{font-size:8px;padding-bottom:11px}.wheel-wrap{width:min(100%,358px);padding:8px;margin-top:12px}.roulette-action{grid-template-columns:1fr;padding-top:12px;margin-top:11px;gap:8px}#spin-btn{min-height:48px;padding:14px 16px;font-size:12px}.hint{font-size:10px}.modal-card{padding:18px 22px 24px;box-shadow:7px 7px 0 #7e2d27}.modal-title{margin-top:24px;font-size:34px}}
    @media(max-height:720px) and (min-width:901px){.container{padding-block:24px}.roulette-kicker{margin-bottom:30px}.wheel-wrap{width:min(100%,460px)}}
    @media(prefers-reduced-motion:reduce){#spin-btn{transition:none}}
  </style>

<body>
  <main class="container">
    <header class="roulette-intro">
      <p class="roulette-kicker"><span>DISPATCH CLUB / PRIZE DRAW</span><span>ONE ENTRY</span></p>
      <h1><span>Один оборот.</span><em>Один шанс.</em></h1>
      <p class="roulette-description">Сюрприз к следующей доставке: восемь исходов — от приоритета и страховки до шутки логиста.</p>
      <div class="roulette-facts"><span>08<br><small>секторов</small></span><span>01<br><small>попытка</small></span></div>
      <p class="demo-label">Portfolio demo / реальные призы не выдаются</p>
    </header>
    <section class="roulette-stage" aria-label="Розыгрыш">
      <div class="stage-meta"><span>Ticket No. 0247</span><span>Valid once</span></div>
      <div class="wheel-wrap">
        <canvas id="roulette" width="350" height="350" aria-label="Колесо с восемью возможными результатами"></canvas>
        <div id="pointer"></div>
      </div>
      <div class="roulette-action"><button id="spin-btn">Вращать колесо <span aria-hidden="true">↗</span></button><p id="hint" class="hint"></p></div>
    </section>
  </main>

  <!-- модалка результата -->
  <div id="result-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <div class="modal-card">
      <div class="modal-index"><span>Result ticket</span><span>No. 0247</span></div>
      <div id="result-title" class="modal-title">Ваш результат</div>
      <div id="result-text" class="modal-text"></div>
      <img id="meme" class="meme hidden" alt="мем"/>
      <button id="close-modal" class="modal-btn">Понятно</button>
    </div>
  </div>

  
  <script>
    /* ===== НАСТРОЙКА ===== */
    // прод-вебхук n8n — поменяй на свой при необходимости
    var WEBHOOK_URL = '';

    // мемы для «дичь от логиста»
    var LOGIST_MEMES = [
      "meme-1.png",
      "meme-2.png",
      "meme-3.png",
      "meme-4.png",
      "meme-5.png"
    ];

    /* ===== Telegram SDK ===== */
    var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    
    // Инициализация Telegram WebApp
    if (tg) {
      try {
        tg.ready && tg.ready();
        tg.setHeaderColor && tg.setHeaderColor('#110f0f');
        tg.setBackgroundColor && tg.setBackgroundColor('#110f0f');
      } catch(e) {
        console.warn('Telegram WebApp error:', e);
      }
    }
  var user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
  var TG_ID = user ? user.id : null;
  var USERNAME = user ? user.username : null;

    /* ===== Версионированный флаг «крутил» + dev/reset ===== */
    var urlParams   = new URLSearchParams(location.search);
    var APP_VERSION = urlParams.get('v') || '1';
    var DEV_MODE    = urlParams.get('dev') === '1';
    var RESET_FLAG  = urlParams.get('reset') === '1';
    var STORAGE_KEY = 'roulette_played_v' + APP_VERSION;

    /* ===== DOM ===== */
    var canvas, ctx, spinBtn, hint, modal, resultText, memeImg, closeModal;

    /* ===== ДАННЫЕ СЕКТОРОВ ===== */
    var prizes = [
      { label: 'дичь от логиста',            color: '#315f5a', weight: 45.45 }, // мемы — чаще всего
      { label: 'сок благодарности',          color: '#a23e37', weight: 27.27 }, // 100 ₽
      { label: 'быстрая полка',              color: '#9a682d', weight: 18.18 }, // приоритет на доставку
      { label: 'прямой перевод',             color: '#375968', weight: 5 },     // 300 ₽
      { label: 'скидка на доставку -10%',    color: '#694762', weight: 10 },    // скидка на следующую доставку
      { label: 'сертификат Ozon',            color: '#4b557e', weight: 1 },     // минимальная вероятность
      { label: 'страховка на отправку',      color: '#607242', weight: 30 },    // бесплатная страховка
      { label: 'второй шанс',                color: '#b2542f', weight: 10 }     // ещё одна попытка
    ];
    var sectors = prizes.length;
    var arc = (2*Math.PI)/sectors;

    /* ===== ГЕОМЕТРИЯ/ОТРИСОВКА ===== */
    var spinning = false;
    var alreadyPlayed = false;
    var secondChanceAvailable = false;
    var secondChanceConsumed = false;
    var usingSecondChanceNow = false;
    var DPR = 1;
    var VISUAL_SIZE = 350; // CSS-пиксели

    function getEffectiveDPR(){
      var dv = (window.devicePixelRatio || 1);
      var vs = (window.visualViewport && window.visualViewport.scale) ? window.visualViewport.scale : 1;
      return Math.max(1, Math.round(dv * vs)); // целое => чётче
    }

    function resizeCanvas(){
      // The canvas fits the framed stage, including its padding and border.
      var stage = document.querySelector('.roulette-stage');
      var available = window.innerWidth - 36;
      if (stage) {
        var stageStyle = getComputedStyle(stage);
        available = stage.clientWidth - parseFloat(stageStyle.paddingLeft) - parseFloat(stageStyle.paddingRight);
      }
      if (!Number.isFinite(available) || available < 260) available = window.innerWidth - 50;
      var maxOuter = window.innerWidth < 500 ? 358 : (window.innerWidth <= 900 ? 390 : 570);
      var heightShare = window.innerWidth < 500 ? .52 : (window.innerWidth <= 900 ? .44 : .68);
      var outer = Math.max(260, Math.min(maxOuter, available, window.innerHeight * heightShare));
      var inset = window.innerWidth < 500 ? 22 : 36;
      var side = Math.floor(outer - inset);
      
      VISUAL_SIZE = side;

      var wheelWrap = document.querySelector('.wheel-wrap');
      if (wheelWrap) {
        wheelWrap.style.width = outer + 'px';
        wheelWrap.style.height = outer + 'px';
      }

      canvas.style.width  = VISUAL_SIZE + 'px';
      canvas.style.height = VISUAL_SIZE + 'px';

      DPR = getEffectiveDPR();
      canvas.width  = VISUAL_SIZE * DPR;
      canvas.height = VISUAL_SIZE * DPR;

      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(DPR, DPR);
      ctx.imageSmoothingEnabled = true;

      drawStatic();
    }

    // Хелпер: авто-подгон шрифта + перенос до двух строк
    function fitLabelToSector(ctx, label, maxWidthPx, baseFontPx, minFontPx) {
      let fontPx = baseFontPx;
      while (fontPx >= minFontPx) {
        ctx.font = `600 ${fontPx}px -apple-system, Segoe UI, Roboto, Arial`;
        if (ctx.measureText(label).width <= maxWidthPx) {
          return { lines: [label], fontPx };
        }
        fontPx -= 1;
      }
      const words = label.split(' ');
      if (words.length === 1) return { lines: [label], fontPx: minFontPx };

      for (let cut = 1; cut < words.length; cut++) {
        const l1 = words.slice(0, cut).join(' ');
        const l2 = words.slice(cut).join(' ');
        let fp = baseFontPx;
        while (fp >= minFontPx) {
          ctx.font = `600 ${fp}px -apple-system, Segoe UI, Roboto, Arial`;
          if (Math.max(ctx.measureText(l1).width, ctx.measureText(l2).width) <= maxWidthPx) {
            return { lines: [l1, l2], fontPx: fp };
          }
          fp -= 1;
        }
      }
      return { lines: [label], fontPx: minFontPx };
    }

    function drawWheel(angle){
      var W = VISUAL_SIZE, H = VISUAL_SIZE;

      // «прищёлкнутые» координаты для чётких линий
      var cx = Math.floor(W/2) + 0.5;
      var cy = Math.floor(H/2) + 0.5;
      var r  = Math.floor(Math.min(cx, cy) - 8) + 0.5;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle || 0);
      ctx.translate(-cx, -cy);

      for (var i=0;i<sectors;i++){
        var a0 = i*arc, a1 = a0 + arc;

        // сектор
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.fillStyle = prizes[i].color;
        ctx.arc(cx, cy, r, a0, a1);
        ctx.closePath();
        ctx.fill();

        // граница сектора
        ctx.strokeStyle = 'rgba(0,0,0,.15)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, r, a0, a1);
        ctx.stroke();

        // подпись — крупная, читаемая, но не вылезает
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(a0 + arc/2);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // динамика от радиуса
        const baseFontPx = Math.round(Math.min(22, Math.max(13, r * 0.065)));
        const minFontPx  = Math.max(11, baseFontPx - 5);

        const maxTextWidth = r * 0.70; // безопасная ширина
        const tx           = r * 0.55; // чуть глубже внутрь сектора

        const fitted = fitLabelToSector(ctx, prizes[i].label, maxTextWidth, baseFontPx, minFontPx);
        ctx.font = `600 ${fitted.fontPx}px -apple-system, Segoe UI, Roboto, Arial`;

        // лёгкая тень: на мобилках слабее
        var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        ctx.shadowColor = isMobile ? 'rgba(0,0,0,.2)' : 'rgba(0,0,0,.28)';
        ctx.shadowBlur  = isMobile ? 0.6 : 1.1;

        if (fitted.lines.length === 1){
          ctx.fillText(fitted.lines[0], tx, 0);
        } else {
          const lh = fitted.fontPx + 2;
          ctx.fillText(fitted.lines[0], tx, -lh/2);
          ctx.fillText(fitted.lines[1], tx,  lh/2);
        }
        ctx.restore();
      }
      ctx.restore();

      // белый ободок
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#e8ddca';
      ctx.beginPath(); ctx.arc(cx, cy, r+2, 0, Math.PI*2); ctx.stroke();

      // центр
      ctx.fillStyle = '#d84a3f';
      ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = 1; ctx.stroke();
    }
    function drawStatic(){ ctx.clearRect(0,0,canvas.width,canvas.height); drawWheel(0); }

    /* ===== ТЕКСТЫ ===== */
    function buildMessageHTML(prizeLabel){
      if (prizeLabel === 'сок благодарности')

    function postPrize(payload){ window.demoLastPrize=payload.prize; return Promise.resolve(); }

/* ===== СПИН (веса) ===== */
function pickIndexByWeight(arr) {
  const total = arr.reduce((s, x) => s + (x.weight || 1), 0);
  let r = Math.random() * total;
  for (let i = 0; i < arr.length; i++) {
    r -= (arr[i].weight || 1);
    if (r <= 0) return i;
  }
  return arr.length - 1;
}

function spin(){
  if (spinning) return;
  if (!DEV_MODE && alreadyPlayed && !secondChanceAvailable) return; // «1 раз» (кроме dev), кроме второго шанса

  usingSecondChanceNow = false;
  if (hint) hint.textContent = '';

  if (secondChanceAvailable){
    usingSecondChanceNow = true;
    secondChanceAvailable = false;
    secondChanceConsumed = true;
    try{ if(!DEV_MODE) localStorage.setItem(STORAGE_KEY, '1'); }catch(_){}
  }

  spinning = true; 
  spinBtn.disabled = true;

  // выбор сектора по весам + целевая остановка
  var chosenIdx = pickIndexByWeight(prizes);
  var stopAngle = chosenIdx * arc + arc/2;
  var total = (Math.floor(Math.random()*5) + 8)*2*Math.PI + (2*Math.PI - stopAngle);
  var start = null, duration = 6000;

  function frame(ts){
    if(!start) start = ts;
    var p = Math.min(1, (ts - start)/duration);
    var ease = 1 - Math.pow(1 - p, 4);
    var angle = ease * total;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawWheel(angle);

    if (p < 1){
      requestAnimationFrame(frame);
    } else {
      var current = angle % (2 * Math.PI);
      var winAngle = (2 * Math.PI - current) % (2 * Math.PI);
      var idx = Math.floor(winAngle / arc) % sectors;
      var prizeLabel = prizes[idx].label;;

      var memeUrl = '';
      if (prizeLabel === 'дичь от логиста' && LOGIST_MEMES.length){
        memeUrl = LOGIST_MEMES[Math.floor(Math.random()*LOGIST_MEMES.length)];
      }

      var messageHTML = buildMessageHTML(prizeLabel, memeUrl);
      var modalText   = textForModal(prizeLabel);

      // модалка
      resultText.textContent = modalText;
      if (memeUrl){
        memeImg.src = memeUrl; 
        memeImg.classList.remove('hidden'); 
        memeImg.style.display = 'block';
      } else {
        memeImg.removeAttribute('src'); 
        memeImg.classList.add('hidden'); 
        memeImg.style.display = 'none';
      }
      modal.classList.remove('hidden'); closeModal.focus();

      var isSecondChance = (prizeLabel === 'второй шанс');

      if (isSecondChance && !secondChanceConsumed){
        secondChanceAvailable = true;
        secondChanceConsumed = false;
        spinBtn.disabled = false;
        alreadyPlayed = true;
        hint.textContent = 'Вам выпал второй шанс — можно крутить ещё раз!';
        try{ if(!DEV_MODE) localStorage.setItem(STORAGE_KEY, 'second_chance'); }catch(_){}
      } else {
        secondChanceAvailable = false;
        try{ if(!DEV_MODE) localStorage.setItem(STORAGE_KEY, '1'); }catch(_){}
        alreadyPlayed = !DEV_MODE;
        spinBtn.disabled = alreadyPlayed;
        if (!DEV_MODE && alreadyPlayed){
          hint.textContent = 'Вы уже крутили колесо на этом устройстве.';
        } else {
          hint.textContent = '';
        }
      }

      usingSecondChanceNow = false;
      spinning = false;

      // отправка в n8n
      postPrize({
        tg_id: TG_ID,
        username: USERNAME,
        prize: prizeLabel,
        message_html: messageHTML,
        meme_url: memeUrl,
        ts: Date.now(),
        event_id: String(TG_ID||'0') + '-' + String(Date.now())
      });
    }
  }
  requestAnimationFrame(frame);
}

document.addEventListener('keydown',function(e){if(e.key==='Escape'&&modal){modal.classList.add('hidden');spinBtn.focus();}});
    /* ===== INIT ===== */
    function init(){
      // DOM
      canvas     = document.getElementById('roulette');
      ctx        = canvas.getContext('2d');
      spinBtn    = document.getElementById('spin-btn');
      hint       = document.getElementById('hint');
      modal      = document.getElementById('result-modal');
      resultText = document.getElementById('result-text');
      memeImg    = document.getElementById('meme');
      closeModal = document.getElementById('close-modal');

      // reset по параметру
      try{ if (RESET_FLAG) localStorage.removeItem(STORAGE_KEY); }catch(_){}

      // «1 раз» (кроме dev) + обработка второго шанса
      try{
        if (!DEV_MODE){
          var storedState = localStorage.getItem(STORAGE_KEY);
          if (storedState === '1'){
            alreadyPlayed = true;
            spinBtn.disabled = true;
            hint.textContent = 'Вы уже крутили колесо на этом устройстве.';
          } else if (storedState === 'second_chance'){
            alreadyPlayed = true;
            secondChanceAvailable = true;
            secondChanceConsumed = false;
            hint.textContent = 'У вас есть второй шанс — воспользуйтесь им!';
          }
        }
      }catch(_){}

      resizeCanvas();
      window.addEventListener('resize', function(){
        resizeCanvas();
      });
      
      window.addEventListener('orientationchange', function(){
        setTimeout(resizeCanvas, 100);
      });
      spinBtn.addEventListener('click', spin);
      closeModal.addEventListener('click', function(){
        modal.classList.add('hidden'); spinBtn.focus();
        try{ tg && tg.close && tg.close(); }catch(_){}
      });
    }

    if (document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
